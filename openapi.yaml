openapi: 3.0.3

info:
  title: Music API
  description: API untuk mengelola penyanyi, album, dan lagu.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local server

paths:

  /penyanyi:

    get:
      summary: Mendapatkan semua penyanyi

      responses:
        '200':
          description: Berhasil mendapatkan data penyanyi

    post:
      summary: Menambahkan penyanyi

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenyanyiInput'

      responses:
        '201':
          description: Penyanyi berhasil ditambahkan

  /penyanyi/{id}:

    get:
      summary: Mendapatkan penyanyi berdasarkan ID

      parameters:
        - $ref: '#/components/parameters/ID'

      responses:
        '200':
          description: Berhasil
        '404':
          description: Penyanyi tidak ditemukan

    put:
      summary: Mengubah penyanyi

      parameters:
        - $ref: '#/components/parameters/ID'

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenyanyiInput'

      responses:
        '200':
          description: Penyanyi berhasil diubah

    delete:
      summary: Menghapus penyanyi

      parameters:
        - $ref: '#/components/parameters/ID'

      responses:
        '200':
          description: Penyanyi berhasil dihapus

  /album:

    get:
      summary: Mendapatkan semua album

      responses:
        '200':
          description: Berhasil

    post:
      summary: Menambahkan album

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumInput'

      responses:
        '201':
          description: Album berhasil ditambahkan

  /album/{id}:

    get:
      summary: Mendapatkan album berdasarkan ID

      parameters:
        - $ref: '#/components/parameters/ID'

      responses:
        '200':
          description: Berhasil

    put:
      summary: Mengubah album

      parameters:
        - $ref: '#/components/parameters/ID'

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumInput'

      responses:
        '200':
          description: Album berhasil diubah

    delete:
      summary: Menghapus album

      parameters:
        - $ref: '#/components/parameters/ID'

      responses:
        '200':
          description: Album berhasil dihapus

  /lagu:

    get:
      summary: Mendapatkan semua lagu

      responses:
        '200':
          description: Berhasil

    post:
      summary: Menambahkan lagu

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaguInput'

      responses:
        '201':
          description: Lagu berhasil ditambahkan

  /lagu/{id}:

    get:
      summary: Mendapatkan lagu berdasarkan ID

      parameters:
        - $ref: '#/components/parameters/ID'

      responses:
        '200':
          description: Berhasil

    put:
      summary: Mengubah lagu

      parameters:
        - $ref: '#/components/parameters/ID'

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaguInput'

      responses:
        '200':
          description: Lagu berhasil diubah

    delete:
      summary: Menghapus lagu

      parameters:
        - $ref: '#/components/parameters/ID'

      responses:
        '200':
          description: Lagu berhasil dihapus

components:

  parameters:

    ID:
      name: id
      in: path
      required: true

      schema:
        type: integer
        example: 1

  schemas:

    PenyanyiInput:
      type: object

      required:
        - nama

      properties:

        nama:
          type: string
          example: Wave to Earth

    AlbumInput:
      type: object

      required:
        - nama_album
        - tahun
        - penyanyi_id

      properties:

        nama_album:
          type: string
          example: Parachutes

        tahun:
          type: integer
          example: 2000

        penyanyi_id:
          type: integer
          example: 2

    LaguInput:
      type: object

      required:
        - judul
        - album_id

      properties:

        judul:
          type: string
          example: Yellow

        album_id:
          type: integer
          example: 3