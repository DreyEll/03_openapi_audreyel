openapi: 3.0.3

info:
  title: Music API
  description: API untuk mengelola penyanyi, album, dan lagu
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:

  /penyanyi:

    get:
      summary: Mendapatkan semua penyanyi
      responses:
        '200':
          description: Berhasil

    post:
      summary: Menambahkan penyanyi

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object
              required:
                - nama
              properties:
                nama:
                  type: string
                  example: Coldplay

      responses:
        '201':
          description: Berhasil menambahkan penyanyi

  /penyanyi/{id}:

    put:
      summary: Mengubah penyanyi

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: Wave to Earth Baru

      responses:
        '200':
          description: Berhasil mengubah penyanyi

    delete:
      summary: Menghapus penyanyi

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Berhasil menghapus penyanyi

  /album:

    get:
      summary: Mendapatkan semua album
      responses:
        '200':
          description: Berhasil

    post:
      summary: Menambahkan album

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object
              properties:
                nama_album:
                  type: string
                tahun:
                  type: integer
                penyanyi_id:
                  type: integer

      responses:
        '201':
          description: Berhasil

  /album/{id}:

    put:
      summary: Mengubah album

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object
              properties:
                nama_album:
                  type: string
                tahun:
                  type: integer
                penyanyi_id:
                  type: integer

      responses:
        '200':
          description: Berhasil

    delete:
      summary: Menghapus album

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Berhasil

  /lagu:

    get:
      summary: Mendapatkan semua lagu
      responses:
        '200':
          description: Berhasil

    post:
      summary: Menambahkan lagu

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object
              properties:
                judul:
                  type: string
                album_id:
                  type: integer

      responses:
        '201':
          description: Berhasil

  /lagu/{id}:

    put:
      summary: Mengubah lagu

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object
              properties:
                judul:
                  type: string
                album_id:
                  type: integer

      responses:
        '200':
          description: Berhasil

    delete:
      summary: Menghapus lagu

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Berhasil